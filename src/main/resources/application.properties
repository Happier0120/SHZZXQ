spring.application.name=property-supervision

# Property center Socket connection
property-center.socket.host=${PROPERTY_CENTER_SOCKET_HOST:127.0.0.1}
property-center.socket.port=${PROPERTY_CENTER_SOCKET_PORT:9000}
property-center.socket.connect-timeout-millis=${PROPERTY_CENTER_SOCKET_CONNECT_TIMEOUT_MILLIS:3000}
property-center.socket.read-timeout-millis=${PROPERTY_CENTER_SOCKET_READ_TIMEOUT_MILLIS:10000}

# MySQL datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/property_supervision?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:property_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath*:/com/example/propertysupervision/persistence/mapper/*.xml
mybatis.type-aliases-package=com.example.propertysupervision.persistence.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Bank inbound Socket server
bank.socket.server.enabled=${BANK_SOCKET_SERVER_ENABLED:false}
bank.socket.server.bind-address=${BANK_SOCKET_SERVER_BIND_ADDRESS:0.0.0.0}
bank.socket.server.backlog=${BANK_SOCKET_SERVER_BACKLOG:100}
bank.socket.server.read-timeout-millis=${BANK_SOCKET_SERVER_READ_TIMEOUT_MILLIS:10000}
bank.socket.server.worker-threads=${BANK_SOCKET_SERVER_WORKER_THREADS:8}

# Set BANK_SOCKET_SERVER_PORT when the server is enabled.
